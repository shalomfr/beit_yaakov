# Render Blueprint for Beit Yaakov Financial System
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: beit-yaakov-system
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://beit_yaakov_user:JGytZe2XZRUtLeFSVoZVfFNN8MKpIL7W@dpg-d5e4tqmr433s73f6uceg-a.oregon-postgres.render.com/beit_yaakov
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: beit-yaakov-system
          property: host
