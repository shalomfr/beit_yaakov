# Render Blueprint for Beit Yaakov Financial System
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: beit-yaakov-system
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/prod.db
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: beit-yaakov-system
          property: host
